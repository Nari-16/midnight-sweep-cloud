name: Midnight Sweep Cloud Check

on:
  schedule:
    # Runs at 5 minutes past every hour (gives the 1H candle time to fully close)
    - cron: "5 * * * *"
  workflow_dispatch: {}   # lets you also trigger it manually to test

jobs:
  check-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run sweep check
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sweep_check.py
